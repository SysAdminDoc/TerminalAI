[workspace]
resolver = "2"
members = ["crates/terminalai-core", "crates/terminalai-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/SysAdminDoc/TerminalAI"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]

[workspace.dependencies]
terminalai-core = { path = "crates/terminalai-core", version = "0.1.0" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
which = "7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
