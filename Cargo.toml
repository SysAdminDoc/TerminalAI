[workspace]
resolver = "2"
members = [
    "crates/terminalai-core",
    "crates/terminalai-daemon",
    "crates/terminalai-app",
    "crates/terminalai-probe",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SysAdminDoc/TerminalAI"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]

[workspace.dependencies]
terminalai-core = { path = "crates/terminalai-core", version = "0.2.0" }
terminalai-daemon = { path = "crates/terminalai-daemon", version = "0.2.0" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.20.2", default-features = false }
vte = { version = "0.15.0", features = ["ansi"] }
unicode-width = "0.2"
proptest = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
which = "7"
interprocess = "2.4.3"
widestring = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
