[workspace]
resolver = "2"
members = [
    "crates/terminalai-core",
    "crates/terminalai-daemon",
    "crates/terminalai-app",
    "crates/terminalai-probe",
]

[workspace.package]
version = "0.12.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SysAdminDoc/TerminalAI"
authors = ["SysAdminDoc <matt_parker@outlook.com>"]

[workspace.dependencies]
terminalai-core = { path = "crates/terminalai-core", version = "0.12.1" }
terminalai-daemon = { path = "crates/terminalai-daemon", version = "0.12.1" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse", "serde"] }
vte = { version = "0.15.0", features = ["ansi"] }
unicode-width = "0.2"
proptest = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
getrandom = "0.3"
which = { version = "8", default-features = false, features = ["real-sys"] }
interprocess = "2.4.3"
widestring = "1"
libc = "0.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
