[package]
name = "terminalai-app"
description = "Tauri desktop shell for the TerminalAI daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "terminalai"
path = "src/main.rs"

[features]
default = []
# What makes a build load its embedded frontend instead of the dev server. The
# `tauri` CLI turns this on for a bundled build; a bare `cargo build --release`
# does not, and the binary it produces is a dev shell pointed at `devUrl` --
# which is why the end-to-end harness asks for it by name.
custom-protocol = ["tauri/custom-protocol"]
wdio = ["dep:tauri-plugin-wdio"]
wdio-embedded = ["wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
terminalai-core.workspace = true
terminalai-daemon = { path = "../terminalai-daemon", version = "0.24.0" }
tauri = { version = "2.11.5", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
windows-sys.workspace = true
tracing.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
# `shellexecute-on-windows` calls ShellExecuteW directly. The default path
# spawns a helper process instead; neither uses `cmd.exe` (that is behind the
# crate's `insecure` feature, which stays off), but going straight to the shell
# API keeps an agent-supplied URI out of any argv.
open = { version = "5.4.0", default-features = false, features = ["shellexecute-on-windows"] }
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
tauri-winrt-notification = "0.8.1"
