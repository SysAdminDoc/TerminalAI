[package]
name = "terminalai-app"
description = "Tauri desktop shell for the TerminalAI daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "terminalai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
terminalai-core.workspace = true
terminalai-daemon = { path = "../terminalai-daemon", version = "0.1.0" }
tauri = { version = "2.11.5", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
