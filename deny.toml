[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
# cargo-deny 0.20+ denies vulnerabilities by default; the removed pre-0.20
# spelling was `vulnerability = "deny"`.
unmaintained = "all"
yanked = "warn"

ignore = [
