    { id = "RUSTSEC-2025-0081", reason = "Transitive through Tauri's urlpattern dependency; no safe upgrade is available. Upstream: https://rustsec.org/advisories/RUSTSEC-2025-0081" },
    { id = "RUSTSEC-2025-0098", reason = "Transitive through Tauri's urlpattern dependency; no safe upgrade is available. Upstream: https://rustsec.org/advisories/RUSTSEC-2025-0098" },
    { id = "RUSTSEC-2025-0100", reason = "Transitive through Tauri's urlpattern dependency; no safe upgrade is available. Upstream: https://rustsec.org/advisories/RUSTSEC-2025-0100" },
